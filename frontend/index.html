<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192x192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no, maximum-scale=1.0" />

    <!-- PWA / mobile web app -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="MAX">
    <meta name="application-name" content="MAX">
    <meta name="theme-color" content="#FF6B35" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="MAX — Your autonomous AI agent. Build, search, automate — all from one chat." />

    <!-- Open Graph -->
    <meta property="og:title" content="MAX — AI Agent" />
    <meta property="og:description" content="Your autonomous AI agent. Build, search, automate — all from one chat." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/icon-512x512.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MAX — AI Agent" />
    <meta name="twitter:description" content="Your autonomous AI agent." />
    <meta name="twitter:image" content="/icon-512x512.png" />

    <title>MAX — AI Agent</title>

    <!-- Register service worker for PWA installability + push notifications -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js', { scope: '/' })
            .then(reg => { console.log('[SW] Registered', reg.scope); })
            .catch(err => { console.warn('[SW] Registration failed', err); });
        });
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

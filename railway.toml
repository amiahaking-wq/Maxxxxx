[build]
builder = "DOCKERFILE"
# The Dockerfile is at the repo root so it can access both app/ and idk-codex/
dockerfilePath = "Dockerfile"
# Build context is the repo root (Railway default)

[deploy]
startCommand = "node server.js"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
numReplicas = 1

[[services]]
name = "telegram-agent"

[services.healthcheck]
path = "/api/health"
# Railway automatically uses the PORT environment variable for healthchecks
initialDelaySeconds = 30
periodSeconds = 30
timeoutSeconds = 10
failureThreshold = 3
